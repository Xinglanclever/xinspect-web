    <rect x="37" y="69" width="42" height="127" rx="2"/><path d="M43 87h30M43 111h30M43 144h30M43 178h30" fill="none"/>
    <rect x="105" y="73" width="14" height="105" rx="2"/><rect x="128" y="56" width="100" height="14" rx="2"/>
    <rect x="263" y="261" width="52" height="49" rx="3"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="8" fill="#5b6b63" letter-spacing="1"><text x="23" y="140" transform="rotate(-90 23 140)">REAR I/O</text><text x="289" y="290" text-anchor="middle" fill="#f5f3e9">PCH</text><text x="115" y="339">GENERIC BOARD · TOP VIEW</text></g>
  <g class="board-region is-selected" data-board-region="cpu">
