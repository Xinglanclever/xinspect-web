<svg xmlns="http://www.w3.org/2000/svg" class="board-map" viewBox="0 0 440 390" role="img" aria-labelledby="boardMapTitle boardMapDesc">
  <title id="boardMapTitle">主機板接口通用示意</title>
  <desc id="boardMapDesc">俯視示意：CPU 插座在上半部，四條 DIMM 在右側，PCIe 在下半部，M.2 與 SATA 分開，頂部為 2×4 的 EPS 供電，右緣為 2×12 的 ATX 主供電。不是特定型號或接線圖。</desc>
  <defs>
    <pattern id="boardGrid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d9ded5" stroke-width=".5"/></pattern>
    <pattern id="cpuContacts" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".75" fill="#a6a38b"/></pattern>
    <pattern id="slotContacts" width="5" height="6" patternUnits="userSpaceOnUse"><path d="M2 0v6" stroke="#c6b67e" stroke-width="1.5"/></pattern>
    <pattern id="dimmContacts" width="6" height="5" patternUnits="userSpaceOnUse"><path d="M0 2h6" stroke="#b8b4a4" stroke-width="1"/></pattern>
  </defs>
  <rect x="0" y="0" width="440" height="390" fill="url(#boardGrid)"/>
  <path d="M47 24H385V356H47Z" fill="#e2e6dc" stroke="#4b6059" stroke-width="2"/>
