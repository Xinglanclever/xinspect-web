    <g fill="#3c5046" stroke="#6b8171" stroke-width="1.2"><rect x="335" y="270" width="17" height="22"/><rect x="357" y="270" width="17" height="22"/><rect x="335" y="297" width="17" height="22"/><rect x="357" y="297" width="17" height="22"/></g>
