  </g>
  <g font-family="Arial, sans-serif" font-size="7" fill="#748377" letter-spacing=".5"><text x="48" y="376">INTERFACE STUDY / NOT A WIRING DIAGRAM</text><path d="M338 373h47m-47-3v6m47-6v6" stroke="#849486"/></g>
</svg>
